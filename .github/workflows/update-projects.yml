name: Update Projects Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch repositories
        run: |
          curl -s "https://api.github.com/users/silentwolfproject/repos?per_page=100&sort=updated" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/repos.json
          jq '{updated_at: (now | todate), repos: [.[] | {name, description, url: .html_url, language, stars: .stargazers_count, forks: .forks_count, updated: .updated_at, topics}]}' /tmp/repos.json > data/projects.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update projects data"
          git push